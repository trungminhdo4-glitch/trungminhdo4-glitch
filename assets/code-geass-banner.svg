<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Code Geass inspired tactical chess banner">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.6" stop-color="#070b14"/>
      <stop offset="1" stop-color="#0d0608"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="softS" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg2)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect width="1200" height="360" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2"/>

  <!-- sweeping scan bar -->
  <rect x="0" y="48" width="90" height="264" fill="#ff2a2a" opacity="0.07">
    <animateTransform attributeName="transform" type="translate" values="0 0; 1110 0; 0 0" keyTimes="0;0.5;1" dur="9s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="48" width="2" height="264" fill="#ff2a2a" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="0 0; 1110 0; 0 0" keyTimes="0;0.5;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.15;0.5" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- top bar -->
  <g font-family="Consolas, Menlo, monospace">
    <circle cx="40" cy="26" r="6" fill="#ff2a2a">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="58" y="32" font-size="17" letter-spacing="4" fill="#e2e8f0">BLACK KNIGHTS // TACTICAL COMMAND</text>
    <text x="1160" y="32" font-size="15" letter-spacing="3" fill="#38bdf8" text-anchor="end">TURN 07 — YOUR MOVE</text>
    <line x1="24" y1="48" x2="1176" y2="48" stroke="#38bdf8" stroke-opacity="0.3"/>
  </g>

  <!-- mid line -->
  <line x1="600" y1="60" x2="600" y2="300" stroke="#e2e8f0" stroke-opacity="0.18" stroke-dasharray="6 8"/>

  <!-- left army (red, dim back rank) -->
  <g font-family="serif" font-size="54" text-anchor="middle" fill="#ff2a2a" fill-opacity="0.35">
    <text x="200" y="200">♜</text>
    <text x="290" y="200">♝</text>
    <text x="380" y="200">♛</text>
    <text x="200" y="262" font-size="34" fill-opacity="0.3">♟ ♟ ♟</text>
  </g>

  <!-- right army (blue-white, dim back rank) -->
  <g font-family="serif" font-size="54" text-anchor="middle" fill="#93c5fd" fill-opacity="0.35">
    <text x="820" y="200">♚</text>
    <text x="910" y="200">♝</text>
    <text x="1000" y="200">♜</text>
    <text x="1000" y="262" font-size="34" fill-opacity="0.3">♟ ♟ ♟</text>
  </g>

  <!-- target pawn (gets taken at the strike moment, respawns each loop) -->
  <g font-family="serif" font-size="64" text-anchor="middle">
    <text x="700" y="215" fill="#e2e8f0" opacity="0.9">♟<animate attributeName="opacity" values="0.9;0.9;0;0;0.9" keyTimes="0;0.32;0.38;0.92;1" dur="9s" repeatCount="indefinite"/></text>
  </g>

  <!-- attacking knight: lunges from the left, strikes, retreats (9s loop) -->
  <g font-family="serif" font-size="110" text-anchor="middle">
    <text x="600" y="235" fill="#ff2a2a" filter="url(#softS)">♞<animateTransform attributeName="transform" type="translate" values="-260 0; 40 0; 40 0; -260 0" keyTimes="0;0.32;0.7;1" dur="9s" repeatCount="indefinite"/></text>
  </g>

  <!-- impact flash + CHECK callout at strike moment -->
  <circle cx="700" cy="190" r="46" fill="#ff2a2a" opacity="0" filter="url(#soft2)">
    <animate attributeName="opacity" values="0;0;0.85;0;0" keyTimes="0;0.31;0.37;0.46;1" dur="9s" repeatCount="indefinite"/>
  </circle>
  <g font-family="Consolas, Menlo, monospace" text-anchor="middle">
    <text x="700" y="130" font-size="34" letter-spacing="10" fill="#ff2a2a" opacity="0">CHECK<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.31;0.37;0.62;0.7" dur="9s" repeatCount="indefinite"/></text>
    <text x="600" y="292" font-size="17" letter-spacing="3" fill="#f1f5f9">STRATEGY BEATS POWER — repro first. smallest correct patch.</text>
  </g>

  <!-- command log (cycles 3 lines) -->
  <g font-family="Consolas, Menlo, monospace" font-size="14" fill="#7dd3fc">
    <text x="40" y="90" opacity="1">&gt; analyzing formation… 4 hostile pieces, 1 weak pawn<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.3;0.36;0.94;1" dur="9s" repeatCount="indefinite"/></text>
    <text x="40" y="90" opacity="0">&gt; sacrifice nothing. knight takes pawn on e5.<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.36;0.62;0.68" dur="9s" repeatCount="indefinite"/></text>
    <text x="40" y="90" opacity="0">&gt; checkmate in 3 — proof over promises.<animate attributeName="opacity" values="0;0;0;1;1" keyTimes="0;0.62;0.68;0.94;1" dur="9s" repeatCount="indefinite"/></text>
  </g>

  <!-- meters bottom-right -->
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#94a3b8">
    <text x="880" y="282">REPRO</text>
    <rect x="950" y="270" width="180" height="10" fill="#1e293b"/>
    <rect x="950" y="270" width="180" height="10" fill="#38bdf8">
      <animate attributeName="width" values="40;180;180;40" keyTimes="0;0.35;0.7;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <text x="880" y="302">PROOF</text>
    <rect x="950" y="290" width="180" height="10" fill="#1e293b"/>
    <rect x="950" y="290" width="180" height="10" fill="#ff2a2a">
      <animate attributeName="width" values="180;60;180;180" keyTimes="0;0.35;0.7;1" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
